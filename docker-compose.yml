services:
  db:
    image: postgres:16-alpine
    container_name: crm_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: crm_db
    ports:
      - "5433:5432"        # ← было "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: ./beckend_crm/Dockerfile
    container_name: crm_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/crm_db
    depends_on:
      - db
    volumes:
      - ./beckend_crm:/app

  frontend:
    build:
      context: ./frontend_crm
      dockerfile: Dockerfile
    container_name: crm_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend_crm:/app
      - /app/node_modules

volumes:
  postgres_data: